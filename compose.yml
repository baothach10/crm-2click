services:
  db:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  importer:
    build:
      context: ./app
      target: runtime
    image: exhibition-crm-app:local
    environment:
      DATABASE_URL: postgres://crm:local-development-only@db:5432/crm
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/import/run.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ./app
      target: runtime
    image: exhibition-crm-app:local
    environment:
      DATABASE_URL: postgres://crm:local-development-only@db:5432/crm
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      importer:
        condition: service_completed_successfully

  # Opt-in only (never runs as part of `./dev.sh`): `docker compose --profile test run --rm test`.
  # Uses the already-imported archive and the already-running app, so run it after `./dev.sh`.
  test:
    build:
      context: ./app
      target: test
    environment:
      DATABASE_URL: postgres://crm:local-development-only@db:5432/crm
      DATA_DIR: /app/data
      TEST_BASE_URL: http://app:3000
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    profiles: ["test"]

volumes:
  postgres-data:
